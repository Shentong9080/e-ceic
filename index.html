<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>💛 给最亲爱的你 · 孕期小暖站</title>
    <style>
        /* ... 你的原有样式保持不变 ... */
    </style>
</head>
<body>
<!-- ... 你的原有 HTML 结构保持不变 ... -->

<script>
    (function() {
        // ---------- 工具：获取今天的日期字符串 (YYYY-MM-DD) ----------
        function getTodayStr() {
            const d = new Date();
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        // ---------- 孕周自动计算 (基于末次月经 2026-04-30) ----------
        function updatePregnancyWeek() {
            const dueDate = new Date(2027, 1, 5);
            const lmp = new Date(dueDate);
            lmp.setDate(lmp.getDate() - 280);

            const today = new Date();
            today.setHours(0, 0, 0, 0);
            lmp.setHours(0, 0, 0, 0);

            const diffDays = Math.floor((today - lmp) / (1000 * 60 * 60 * 24));
            if (diffDays < 0) {
                document.getElementById('weekBadge').textContent = '🤰 孕周计算中';
                return;
            }
            const weeks = Math.floor(diffDays / 7);
            const days = diffDays % 7;
            document.getElementById('weekBadge').textContent = `🤰 ${weeks}周+${days}天`;
        }

        // ---------- 喝水计数器 ----------
        const waterDisplay = document.getElementById('waterDisplay');
        const addBtn = document.getElementById('addWaterBtn');
        const resetBtn = document.getElementById('resetWaterBtn');
        let waterCount = 0;
        try {
            const stored = localStorage.getItem('warmPregnancyWater');
            if (stored !== null) {
                const parsed = parseInt(stored, 10);
                if (!isNaN(parsed) && parsed >= 0) waterCount = parsed;
            }
        } catch (_) {}

        function updateWaterDisplay() {
            waterDisplay.textContent = waterCount;
            try { localStorage.setItem('warmPregnancyWater', String(waterCount)); } catch (_) {}
            if (waterCount >= 8) {
                waterDisplay.style.background = '#d3f0e8';
                waterDisplay.style.color = '#125b4a';
            } else {
                waterDisplay.style.background = '#f5fffc';
                waterDisplay.style.color = '#1b5c50';
            }
        }
        function addWater() {
            waterCount += 1;
            updateWaterDisplay();
            addBtn.style.transform = 'scale(0.94)';
            setTimeout(() => { addBtn.style.transform = 'scale(1)'; }, 80);
        }
        function resetWater() {
            if (waterCount === 0) return;
            if (confirm('💧 重置今天的喝水记录吗？')) {
                waterCount = 0;
                updateWaterDisplay();
                resetBtn.style.transform = 'scale(0.94)';
                setTimeout(() => { resetBtn.style.transform = 'scale(1)'; }, 80);
            }
        }
        addBtn.addEventListener('click', addWater);
        resetBtn.addEventListener('click', resetWater);
        updateWaterDisplay();

        // ---------- 日期显示 ----------
        const dateBadge = document.getElementById('dateBadge');
        if (dateBadge) {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
            const weekday = weekdays[now.getDay()];
            dateBadge.textContent = `📅 ${year}.${month}.${day} 周${weekday}`;
        }

        // ---------- 初始化孕周 ----------
        updatePregnancyWeek();

        // ============================================================
        // 🔧 修复：每日清空逻辑 —— 先加载，再判断是否跨天清空
        // ============================================================

        const foodInput = document.getElementById('foodWish');
        const placeInput = document.getElementById('placeWish');
        const moodSelect = document.getElementById('moodSelect');
        const foodHint = document.getElementById('foodSaveHint');
        const placeHint = document.getElementById('placeSaveHint');
        const moodHint = document.getElementById('moodSaveHint');

        // 1️⃣ 先加载存储的值（如果有）
        try {
            const savedFood = localStorage.getItem('warmFoodWish');
            if (savedFood !== null && savedFood !== '') foodInput.value = savedFood;

            const savedPlace = localStorage.getItem('warmPlaceWish');
            if (savedPlace !== null && savedPlace !== '') placeInput.value = savedPlace;

            const savedMood = localStorage.getItem('warmMood');
            if (savedMood !== null && savedMood !== '') moodSelect.value = savedMood;
        } catch (_) {}

        // 2️⃣ 检查是否跨天，如果跨天则清空“每日字段”（点菜 & 想去哪），但保留“心情”
        const today = getTodayStr();
        const lastDate = localStorage.getItem('warmDailyDate');

        if (lastDate !== today) {
            // 跨天了 → 清空今日点菜 + 想去哪
            foodInput.value = '';
            placeInput.value = '';
            // 清空 localStorage 里对应的值
            localStorage.removeItem('warmFoodWish');
            localStorage.removeItem('warmPlaceWish');
            // 更新日期标记
            localStorage.setItem('warmDailyDate', today);
            // 更新提示
            if (foodHint) foodHint.textContent = '✨ 已保存';
            if (placeHint) placeHint.textContent = '✨';
        }

        // 3️⃣ 保存函数（实时保存）
        function saveFood() {
            try { localStorage.setItem('warmFoodWish', foodInput.value); } catch (_) {}
            if (foodHint) {
                foodHint.textContent = '✅ 已存';
                setTimeout(() => { foodHint.textContent = '✨ 已保存'; }, 1200);
            }
        }
        function savePlace() {
            try { localStorage.setItem('warmPlaceWish', placeInput.value); } catch (_) {}
            if (placeHint) {
                placeHint.textContent = '✅ 已存';
                setTimeout(() => { placeHint.textContent = '✨'; }, 1200);
            }
        }
        function saveMood() {
            try { localStorage.setItem('warmMood', moodSelect.value); } catch (_) {}
            if (moodHint) {
                moodHint.textContent = '✅ 已存';
                setTimeout(() => { moodHint.textContent = '✨'; }, 1200);
            }
        }

        // 4️⃣ 绑定事件 —— 使用 'input' 事件实时保存，不再依赖 blur/change
        foodInput.addEventListener('input', saveFood);
        placeInput.addEventListener('input', savePlace);
        moodSelect.addEventListener('change', saveMood);

        // 5️⃣ 页面关闭前也保存一次（保险）
        window.addEventListener('beforeunload', function() {
            saveFood();
            savePlace();
            saveMood();
        });

        // 6️⃣ 初始化提示状态
        setTimeout(() => {
            if (foodInput.value !== '') {
                foodHint.textContent = '✨ 已保存';
            }
            if (placeInput.value !== '') {
                placeHint.textContent = '✨';
            }
            saveMood();
        }, 100);

        // ---------- 双击卡片彩蛋 ----------
        const cards = document.querySelectorAll('.card');
        cards.forEach(card => {
            card.addEventListener('dblclick', function(e) {
                const originalBg = this.style.background;
                this.style.background = '#fff3ec';
                this.style.transition = '0.1s';
                setTimeout(() => {
                    this.style.background = originalBg || '';
                }, 150);
                this.style.transform = 'scale(0.99)';
                setTimeout(() => { this.style.transform = 'scale(1)'; }, 100);
            });
        });

        console.log('💛 孕期小暖站 · 已修复保存问题，实时保存 + 跨天清空');
    })();
</script>

</body>
</html>
